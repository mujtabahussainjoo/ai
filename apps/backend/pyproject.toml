[project]
name = "myaibuddy-backend"
version = "0.1.0"
description = "MyAIBuddy backend API and AI service (conversational, RAG, web research, all-rounder agent)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3.6,<1",
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<25",
    "PyJWT>=2.8,<3",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "tenacity>=8.3,<10",
    "slowapi>=0.1.9,<1",
    "cryptography>=42,<44",
    "orjson>=3.10,<4",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "langchain-anthropic>=0.2,<1",
    "langchain-google-genai>=2.0,<3",
    "langchain-community>=0.3,<1",
    "langchain-huggingface>=0.1,<1",
    "langgraph>=0.2,<1",
    "rank-bm25>=0.2.2,<1",
    "pypdf>=4.0,<6",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "pytesseract>=0.3.10,<1",
]

[project.optional-dependencies]
# Config tooling (install: pip install -e ".[dev]")
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
    "black>=24,<26",
    "mypy>=1.10,<2",
    "pytest-mock>=3.14,<4",
]
# Heavy local embeddings (torch + sentence-transformers). Keep the default install lean.
rag-local = [
    "torch>=2.2",
    "sentence-transformers>=3.0,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "B008", "B903"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-ra --strict-markers -q"
filterwarnings = ["error", "ignore::DeprecationWarning:langchain"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/db/migrations/*", "app/main.py"]