# Nginx config for standalone frontend deployment.
# The frontend is built with VITE_API_BASE_URL set to the external backend URL,
# so API calls go directly to the backend. This config only serves static files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in sync with the backend's MAX_UPLOAD_MB (nginx default is 1MB).
    # Applies if a hypothetical backend proxy is ever added to this config.
    client_max_body_size 50m;

    # Cache static assets for performance.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
