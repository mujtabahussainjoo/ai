name: myaibuddy

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: myaibuddy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myaibuddy
      POSTGRES_USER: myaibuddy
      POSTGRES_PASSWORD: myaibuddy_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myaibuddy -d myaibuddy"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: .
      target: backend
    container_name: myaibuddy-backend
    restart: unless-stopped
    environment:
      APP_NAME: MyAIBuddy
      APP_ENV: production
      APP_URL: http://localhost:8080
      API_PREFIX: /api/v1
      LOG_LEVEL: INFO
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: myaibuddy
      POSTGRES_USER: myaibuddy
      POSTGRES_PASSWORD: myaibuddy_dev
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: keyword
      UPLOAD_DIR: var/uploads
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10/minute}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-30/minute}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-15/minute}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/apps/backend/var/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    container_name: myaibuddy-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data: